<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- <script src="./app.js"></script> -->

    <!-- Code From react -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <script>
      const element = React.createElement(
        "h1",
        {},
        "This is Ankush from React Application"
      )

      console.log("element", element)

      const root = ReactDOM.createRoot(document.getElementById("root"))
      root.render(element)

      /* NESTED Element */

      const nestedElementStructure = React.createElement(
        "div",
        {
          id: "parent",
          className: "parent-class",
          style: { backgroundColor: "red" },
        },
        [
          React.createElement(
            "div",
            {
              id: "child",
              className: "child-class",
            },
            [
              React.createElement("h1", {}, "This is Ankush"),
              React.createElement("h2", {}, "This is Tanvi"),
            ]
          ),
          React.createElement(
            "div",
            {
              id: "child2",
              className: "child-class",
            },
            [
              React.createElement("h1", {}, "This is Ankush 2"),
              React.createElement("h2", {}, "This is Tanvi 2"),
            ]
          ),
        ]
      )

      console.log("check", nestedElementStructure)

      const root2 = ReactDOM.createRoot(document.getElementById("root"))
      root2.render(nestedElementStructure)
    </script>
  </body>
</html>
